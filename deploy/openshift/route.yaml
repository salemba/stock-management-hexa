apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stock-management-route
  labels:
    app: stock-management
spec:
  to:
    kind: Service
    name: stock-management-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
