apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-management-hexa
  labels:
    app: stock-management
    app.kubernetes.io/component: stock-management
    app.kubernetes.io/instance: stock-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-management
  template:
    metadata:
      labels:
        app: stock-management
    spec:
      containers:
        - name: stock-management
          image: image-registry.openshift-image-registry.svc:5000/my-namespace/stock-management-hexa:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: stock-management-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
                  optional: true
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-secret
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
