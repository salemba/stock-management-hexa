spring:
  application:
    name: stock-management-hexa
  
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: ${VAULT_ADDR:http://vault.vault.svc.cluster.local:8200}
      token: ${VAULT_TOKEN:root}
      authentication: ${VAULT_AUTH_MODE:TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: stock-management

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-service}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockdb}
    username: ${POSTGRES_USER:stock_user}
    password: ${POSTGRES_PASSWORD:stock_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
