openapi: 3.0.3
info:
  title: Stock Management API
  description: Contract-first OpenAPI specification for Stock Management Service
  version: 1.0.0
paths:
  /api/v1/stocks:
    get:
      summary: List all stock items
      operationId: getStockItems
      responses:
        '200':
          description: A list of stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockItemResponse'
    post:
      summary: Create a new stock item
      operationId: createStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStockItemRequest'
      responses:
        '201':
          description: Stock item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponse'

  /api/v1/stocks/{sku}:
    get:
      summary: Get stock item by SKU
      operationId: getStockBySku
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stock item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponse'
        '404':
          description: Stock item not found

  /api/v1/stocks/{sku}/add:
    post:
      summary: Add quantity to stock
      operationId: addStock
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: Stock updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponse'

  /api/v1/stocks/{sku}/deduct:
    post:
      summary: Deduct quantity from stock
      operationId: deductStock
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: Stock updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemResponse'

components:
  schemas:
    CreateStockItemRequest:
      type: object
      required:
        - sku
        - name
        - quantity
      properties:
        sku:
          type: string
          example: "ITEM-1001"
        name:
          type: string
          example: "Laptop Pro 15"
        category:
          type: string
          example: "ELECTRONICS"
        unitPrice:
          type: number
          example: 1200.00
        quantity:
          type: number
          example: 50
        reorderThreshold:
          type: number
          example: 5

    StockMovementRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: number
          example: 10
        reason:
          type: string
          example: "Restock from supplier"

    StockItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        unitPrice:
          type: number
        quantity:
          type: number
        reorderThreshold:
          type: number
        reorderNeeded:
          type: boolean
